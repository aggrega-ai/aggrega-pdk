name: PDK

on:
  pull_request:
    paths:
      - 'go/**'
      - 'rust/**'
      - 'typescript/**'
      - 'scripts/**'
      - '.github/workflows/pdk.yml'
  # No paths filter on pushes: a release's push to main needs a check result on every push tip main can receive.
  push:
    branches: [main, dev]

# Each kit resolves aggrega-abi from its registry by the released version its
# manifest names, so a checkout of this repository builds on its own. Two tests
# read files that live in sibling repositories: the shared payload vectors in
# aggrega-abi's testdata/ and the JSON Schemas in aggrega-schemas' json/. Without
# those checkouts the tests skip, saying so; here each job checks both out beside
# this repository (this repo at aggrega-pdk/, the others at aggrega-abi/ and
# aggrega-schemas/) at the release tags matching the versions the kits build
# against, so the tests run. Both sibling repositories are public, so the
# checkouts read them with the run's own token, which a Dependabot or fork pull
# request run receives too.

# Every job reads this repository's contents and nothing else; the run's own
# token reads the public sibling repositories whatever its grants.
permissions:
  contents: read

env:
  # The branch the API check's aggrega-abi checkout reads; that job runs only for
  # a push to dev or a pull request into it, so it reads dev, where the check
  # itself is maintained. The extension's package-and-publish.yml in
  # aggrega-vscode-extension keeps the same value, so a change here is made there
  # too.
  SIBLING_REF: ${{ (github.ref_name == 'dev' || github.base_ref == 'dev') && 'dev' || 'main' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pins:
    # The sibling revisions the test jobs check out, held in one place, and the
    # gate every other job waits on. scripts/check-abi-pins.sh refuses the run when
    # the Go, Rust and TypeScript manifests pin different aggrega-abi releases, and
    # otherwise prints the one release they pin, whose tag the test jobs check out;
    # the aggrega-schemas tag is declared here, the one place it is named.
    # Shared self-hosted-runner switch: set the AGGREGA_RUNNER org/repo variable to route here.
    runs-on: ${{ vars.AGGREGA_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    outputs:
      abi-ref: ${{ steps.pins.outputs.abi-ref }}
      schemas-ref: ${{ steps.pins.outputs.schemas-ref }}
    steps:
      - name: Checkout PDK
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: '1.85'

      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'

      - name: Refuse kits that pin different aggrega-abi releases, and read the sibling revisions
        id: pins
        run: |
          abi_version="$(scripts/check-abi-pins.sh)"
          echo "aggrega-abi tag: v$abi_version"
          {
            echo "abi-ref=v$abi_version"
            # The aggrega-schemas release the round-trip tests are checked against.
            echo "schemas-ref=v0.13.1"
          } >> "$GITHUB_OUTPUT"

  go-pdk:
    needs: pins
    # Shared self-hosted-runner switch: set the AGGREGA_RUNNER org/repo variable to route here.
    runs-on: ${{ vars.AGGREGA_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - name: Checkout PDK
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: aggrega-pdk
          persist-credentials: false

      - name: Checkout ABI (sibling, for the shared payload vectors)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: aggrega-ai/aggrega-abi
          ref: ${{ needs.pins.outputs.abi-ref }}
          path: aggrega-abi
          persist-credentials: false

      - name: Checkout schemas (sibling, for round-trip schema validation)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: aggrega-ai/aggrega-schemas
          ref: ${{ needs.pins.outputs.schemas-ref }}
          path: aggrega-schemas
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26'
          # 🔴 CACHING OFF, consistent with every other workflow here. setup-go
          # caches GOMODCACHE and GOCACHE by default, which is right on an
          # ephemeral hosted runner where both vanish between jobs. On a persistent
          # self-hosted runner they are still on disk next run, so the post-job step
          # tars and uploads gigabytes to re-obtain files that never left — minutes
          # per run, and it evicts entries from the shared cache budget that are not
          # redundant. Reverse it if this job moves to a hosted runner.
          cache: false

      - name: Build Go PDK
        working-directory: aggrega-pdk/go
        run: go build ./...

      - name: Test Go PDK
        working-directory: aggrega-pdk/go
        run: go test ./...

      - name: Build Go fixture — mutator
        working-directory: aggrega-pdk/go/examples/mutator
        run: bash build.sh

      - name: Build Go fixture — policy
        working-directory: aggrega-pdk/go/examples/policy
        run: bash build.sh

  rust-pdk:
    needs: pins
    # Shared self-hosted-runner switch: set the AGGREGA_RUNNER org/repo variable to route here.
    runs-on: ${{ vars.AGGREGA_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - name: Checkout PDK
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: aggrega-pdk
          persist-credentials: false

      - name: Checkout ABI (sibling, for the shared payload vectors)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: aggrega-ai/aggrega-abi
          ref: ${{ needs.pins.outputs.abi-ref }}
          path: aggrega-abi
          persist-credentials: false

      - name: Checkout schemas (sibling, for round-trip schema validation)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: aggrega-ai/aggrega-schemas
          ref: ${{ needs.pins.outputs.schemas-ref }}
          path: aggrega-schemas
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: '1.85'
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: aggrega-pdk/rust

      - name: Verify Rust-1.85-compatible transitive pins
        working-directory: aggrega-pdk/rust
        run: |
          # idna_adapter @ 1.2.x requires rustc 1.86 (pulls in
          # icu_normalizer >= 2.2). The Rust PDK targets rustc 1.85;
          # Cargo.lock pins idna_adapter to the 1.1.x line. Fail the
          # build if a future cargo update bumps past that line before
          # the toolchain floor moves.
          resolved="$(grep -A 1 '^name = "idna_adapter"' Cargo.lock | awk -F\" '/version/ {print $2; exit}')"
          if [ -z "$resolved" ]; then
            echo "ERROR: idna_adapter not found in Cargo.lock; pin verification cannot run."
            exit 1
          fi
          echo "idna_adapter resolved version: $resolved"
          case "$resolved" in
            1.0.*|1.1.*) ;;
            *)
              echo "ERROR: idna_adapter resolved to $resolved, which exceeds the Rust 1.85-compatible pin (<= 1.1.x)."
              echo "Either pin back via 'cargo update idna_adapter --precise <1.1.x>' or bump the Rust toolchain floor."
              exit 1
              ;;
          esac

      - name: Build Rust PDK
        working-directory: aggrega-pdk/rust
        run: cargo build --release

      - name: Test Rust PDK
        working-directory: aggrega-pdk/rust
        run: cargo test

      - name: Build Rust fixture — mutator
        working-directory: aggrega-pdk/rust/examples/mutator
        run: bash build.sh

      - name: Build Rust fixture — policy
        working-directory: aggrega-pdk/rust/examples/policy
        run: bash build.sh

  api-compat:
    # Refuses a breaking change to a kit's exported API that the version being
    # prepared does not mark, judged against the newest release tag. Runs where the
    # next release is prepared: a push to dev and a pull request into it.
    #
    # The check is aggrega-abi's scripts/check-api-compat.sh (its --help is the
    # contract), taken from the ABI sibling's dev, so a change here cannot weaken the
    # check that judges it. It lays the release-tag trees out side by side as the
    # manifests expect, pairing this repository's tag with the ABI tag that tag's
    # rust/Cargo.toml declares on its aggrega-abi dependency; so both checkouts
    # carry their tags. It reads the aggrega-abi release this checkout names from
    # the manifests, as the publish workflow does — rust/Cargo.toml's
    # [workspace.dependencies] through cargo metadata, cross-checked with
    # typescript/package.json — and refuses manifests that disagree on it. It pins and installs its own tools, and the Rust toolchain
    # whose rustdoc it reads, into the per-run directory it is given.
    needs: pins
    if: github.ref_name == 'dev' || github.base_ref == 'dev'
    # Shared self-hosted-runner switch: set the AGGREGA_RUNNER org/repo variable to route here.
    runs-on: ${{ vars.AGGREGA_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - name: Checkout PDK, with its tags
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: aggrega-pdk
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout ABI (sibling, with its tags and the check)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: aggrega-ai/aggrega-abi
          ref: ${{ env.SIBLING_REF }}
          path: aggrega-abi
          fetch-depth: 0
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26'
          # Caching off, as in go-pdk above and for the same reason.
          cache: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: '1.85'

      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'

      - name: Refuse an unmarked breaking change to a kit's exported API
        run: >-
          aggrega-abi/scripts/check-api-compat.sh
          --tools "$RUNNER_TEMP/api-tools"
          --sibling aggrega-abi
          aggrega-pdk

  typescript-pdk:
    needs: pins
    # Shared self-hosted-runner switch: set the AGGREGA_RUNNER org/repo variable to route here.
    runs-on: ${{ vars.AGGREGA_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - name: Checkout PDK
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: aggrega-pdk
          persist-credentials: false

      - name: Checkout ABI (sibling, for the shared payload vectors)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: aggrega-ai/aggrega-abi
          ref: ${{ needs.pins.outputs.abi-ref }}
          path: aggrega-abi
          persist-credentials: false

      - name: Checkout schemas (sibling, for round-trip schema validation)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: aggrega-ai/aggrega-schemas
          ref: ${{ needs.pins.outputs.schemas-ref }}
          path: aggrega-schemas
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          # 🔴 NO PACKAGE CACHE. npm's cache lives in the user's home directory, and
          # this job runs on a PERSISTENT self-hosted runner where that directory
          # survives between runs — so caching it uploads and re-downloads files
          # that never left, and spends part of the shared cache budget doing it.
          #
          # ⚠️ The Rust cache below is deliberately KEPT and is not the same case:
          # `actions/checkout` cleans the workspace by default, so `target/` really
          # is destroyed every run and restoring it does real work. It also prunes
          # itself hard before saving — measured at ~145 MB against ~1.9 GB for an
          # unpruned toolchain cache — so it earns its upload. Judge each cache by
          # whether what it holds survives the next checkout, not by the word cache.
          #
          # Reverse this if the job ever moves to a hosted runner, where the home
          # directory is fresh each time and the npm cache is not redundant.

      # 🔴 NEITHER TOOL IS INSTALLED WITH sudo. A hosted runner grants passwordless
      # sudo; a self-hosted one does not, and `sudo tar` there fails the whole job
      # with "a terminal is required to read the password" — a provisioning fact
      # reported as a build failure, on a step that has nothing to do with the
      # build.
      #
      # Both install into a writable per-run directory added to PATH. That needs no
      # privilege, and since the tools are downloaded from the network either way,
      # placing them there rather than in /usr/local changes nothing about what runs.
      - name: Install binaryen
        run: |
          BIN_VER="version_129"
          PREFIX="$RUNNER_TEMP/tools"
          mkdir -p "$PREFIX"
          curl -fsSL -o /tmp/binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/${BIN_VER}/binaryen-${BIN_VER}-x86_64-linux.tar.gz"
          tar -C "$PREFIX" --strip-components=1 -xzf /tmp/binaryen.tar.gz
          echo "$PREFIX/bin" >> "$GITHUB_PATH"
          "$PREFIX/bin/wasm-merge" --version
          "$PREFIX/bin/wasm-opt" --version

      - name: Install extism-js
        run: |
          EJS_VER="v1.6.0"
          PREFIX="$RUNNER_TEMP/tools"
          mkdir -p "$PREFIX/bin"
          curl -fsSL -o /tmp/extism-js.gz \
            "https://github.com/extism/js-pdk/releases/download/${EJS_VER}/extism-js-x86_64-linux-${EJS_VER}.gz"
          gunzip -f /tmp/extism-js.gz
          chmod +x /tmp/extism-js
          mv /tmp/extism-js "$PREFIX/bin/extism-js"
          echo "$PREFIX/bin" >> "$GITHUB_PATH"
          "$PREFIX/bin/extism-js" --version

      - name: Install TS PDK deps
        working-directory: aggrega-pdk/typescript
        run: npm install

      - name: Test TS PDK
        working-directory: aggrega-pdk/typescript
        run: npm test

      - name: Build TS fixture — mutator
        working-directory: aggrega-pdk/typescript/examples/mutator
        run: bash build.sh

      - name: Build TS fixture — policy
        working-directory: aggrega-pdk/typescript/examples/policy
        run: bash build.sh

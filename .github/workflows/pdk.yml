name: PDK

on:
  pull_request:
    paths:
      - 'go/**'
      - 'rust/**'
      - 'typescript/**'
      - '.github/workflows/pdk.yml'
  push:
    branches: [main]
    paths:
      - 'go/**'
      - 'rust/**'
      - 'typescript/**'
      - '.github/workflows/pdk.yml'

jobs:
  go-pdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install TinyGo
        run: |
          TINYGO_VERSION="0.41.1"
          TINYGO_URL="https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo${TINYGO_VERSION}.linux-amd64.tar.gz"
          curl -fsSL -o /tmp/tinygo.tar.gz "${TINYGO_URL}"
          sudo tar -C /usr/local -xzf /tmp/tinygo.tar.gz
          echo "/usr/local/tinygo/bin" >> "$GITHUB_PATH"

      - name: Build Go PDK
        working-directory: go
        run: go build ./...

      - name: Test Go PDK
        working-directory: go
        run: go test ./...

      - name: Build Go fixture — mutator
        working-directory: go/examples/mutator
        run: bash build.sh

      - name: Build Go fixture — policy-validator
        working-directory: go/examples/policy-validator
        run: bash build.sh

  rust-pdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'
          targets: wasm32-unknown-unknown

      - name: Verify Rust-1.85-compatible transitive pins
        working-directory: rust
        run: |
          # idna_adapter @ 1.2.x requires rustc 1.86 (pulls in
          # icu_normalizer >= 2.2). The Rust PDK targets rustc 1.85
          # per the umbrella's setup-workspace.sh; Cargo.lock pins
          # idna_adapter to the 1.1.x line. Fail the build if a future
          # cargo update bumps past that line before the toolchain
          # floor moves.
          resolved="$(grep -A 1 '^name = "idna_adapter"' Cargo.lock | awk -F\" '/version/ {print $2; exit}')"
          if [ -z "$resolved" ]; then
            echo "ERROR: idna_adapter not found in Cargo.lock; pin verification cannot run."
            exit 1
          fi
          echo "idna_adapter resolved version: $resolved"
          case "$resolved" in
            1.0.*|1.1.*) ;;
            *)
              echo "ERROR: idna_adapter resolved to $resolved, which exceeds the Rust 1.85-compatible pin (<= 1.1.x)."
              echo "Either pin back via 'cargo update idna_adapter --precise <1.1.x>' or bump the Rust toolchain floor."
              exit 1
              ;;
          esac

      - name: Build Rust PDK
        working-directory: rust
        run: cargo build --release

      - name: Test Rust PDK
        working-directory: rust
        run: cargo test

      - name: Build Rust fixture — mutator
        working-directory: rust/examples/mutator
        run: bash build.sh

      - name: Build Rust fixture — policy-validator
        working-directory: rust/examples/policy-validator
        run: bash build.sh

  typescript-pdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install binaryen
        run: |
          BIN_VER="version_129"
          curl -fsSL -o /tmp/binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/${BIN_VER}/binaryen-${BIN_VER}-x86_64-linux.tar.gz"
          sudo tar -C /usr/local --strip-components=1 -xzf /tmp/binaryen.tar.gz
          wasm-merge --version
          wasm-opt --version

      - name: Install extism-js
        run: |
          EJS_VER="v1.6.0"
          curl -fsSL -o /tmp/extism-js.gz \
            "https://github.com/extism/js-pdk/releases/download/${EJS_VER}/extism-js-x86_64-linux-${EJS_VER}.gz"
          gunzip -f /tmp/extism-js.gz
          chmod +x /tmp/extism-js
          sudo mv /tmp/extism-js /usr/local/bin/extism-js
          extism-js --version

      - name: Install TS PDK deps
        working-directory: typescript
        run: npm install

      - name: Test TS PDK
        working-directory: typescript
        run: npm test

      - name: Build TS fixture — mutator
        working-directory: typescript/examples/mutator
        run: bash build.sh

      - name: Build TS fixture — policy-validator
        working-directory: typescript/examples/policy-validator
        run: bash build.sh

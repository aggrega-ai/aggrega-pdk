[package]
name = "policy-regorus-render-rust"
version = "0.1.0-alpha.1"
edition = "2021"
publish = false

# This crate is a self-contained workspace root. It carries an embedded Rego
# evaluator (whose dependency needs a newer Rust than the enclosing plugin
# workspace deliberately floors itself to) and a YAML parser (which must not
# enter the shared lockfile), so it is fully isolated: its own [workspace] table
# detaches it from the parent, its own rust-toolchain.toml selects the newer
# toolchain, and its own Cargo.lock resolves its tree independently. The parent
# workspace excludes this path.
[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# The plugin ABI surface. PolicyResult / PolicyOutput come from the
# PDK re-export (single-sourcing the output shape with every other policy
# guest); RenderPolicyInput comes from the ABI codec crate, which is
# the render-stage input's definitional home.
aggrega-pdk-rust = { path = "../.." }
aggrega-abi = "0.9.1"
# The describe()/verdict_render() export macros for our ABI. Our own extism export is
# the sole entry point.
extism-pdk = "1.4"
serde = { version = "1", features = ["derive"] }
# raw_value matches the ABI crate: the render payload's settings field is a
# serde_json RawValue carried through verbatim.
serde_json = { version = "1", features = ["raw_value"] }
# Multi-document YAML/JSON parsing for the rendered artifacts (YAML is a
# superset of JSON, so a JSON template parses through the same parser).
serde_yaml = "0.9"
# Native-HCL parsing for Terraform render output. A `.tf` file is not YAML or
# JSON, so it is projected through this HCL reader into the same canonical
# object shape a `.tf.json` file already parses to.
hcl-rs = "0.19"
# Error type shared with the ABI surface: extism-pdk's FnResult wraps
# anyhow::Error and regorus returns anyhow::Result, so evaluation errors
# propagate through the export boundary unchanged.
anyhow = "1"
# Embedded Rego evaluator. Pure-Rust, no external OPA process; evaluated
# entirely in-guest so the host stays free of any policy-engine logic.
#
# The engine's default feature set, less `http`. That feature registers
# `http.send` as a builtin that evaluates to undefined rather than making a
# request, so a rule whose body calls it never holds and the policy reaches no
# verdict without saying so. Left out, `http.send` is a builtin this engine does
# not implement: a policy calling it fails evaluation naming the function, the
# same way any other unimplemented builtin does, and the build stops instead of
# passing. A plugin has no network either way.
#
# The list is the engine's own `default` (`full-opa`, `arc`, `rvm`) with
# `full-opa` spelled out minus `http`. A feature a later engine release adds to
# its defaults is not picked up here until it is listed; the builtins it would
# have registered fail loudly in the meantime rather than allowing.
#
# The same list appears in the graph-stage Rego example beside this one and in
# the compiler's own Rego governance plugin. That is deliberate: each of the
# three is a workspace root of its own, so no shared dependency table can hold
# the list for all of them, and an example is meant to be readable and buildable
# on its own. Change the three together.
regorus = { version = "0.12.0", default-features = false, features = [
    "arc",
    "base64",
    "base64url",
    "cache",
    "coverage",
    "glob",
    "graph",
    "hex",
    "jsonschema",
    "net",
    "opa-runtime",
    "regex",
    "rvm",
    "semver",
    "std",
    "time",
    "urlquery",
    "uuid",
    "yaml",
] }

[profile.release]
# Optimise for size: the embedded evaluator and the YAML parser dominate the
# artifact. Whole-program link-time optimisation with a single codegen unit lets
# dead code across the dependency tree be discarded; aborting on panic and
# stripping symbols removes the unwinding machinery and the symbol table,
# neither of which the guest needs.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

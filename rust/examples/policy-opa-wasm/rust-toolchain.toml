#
# This crate embeds a WebAssembly interpreter and is excluded from the enclosing
# plugin workspace. It pins the current stable toolchain for its own build so
# the two workspaces never collide.
[toolchain]
channel = "stable"
targets = ["wasm32-wasip1"]

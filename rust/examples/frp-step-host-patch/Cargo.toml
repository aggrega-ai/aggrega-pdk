[package]
name = "frp-step-host-patch-rust"
version = "0.1.0-alpha.1"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
aggrega-pdk-rust = { path = "../.." }
# The pipeline-step payload types and their codec, generated into the portable
# ABI crate the kit itself builds against.
aggrega-abi = { workspace = true }
extism-pdk = "1.4"
serde_json = "1"

#
# The embedded Rego evaluator needs a newer Rust than the enclosing plugin
# workspace floors itself to. This crate is excluded from that workspace and
# pins the current stable toolchain for its own build so the two never collide.
[toolchain]
channel = "stable"
targets = ["wasm32-wasip1"]

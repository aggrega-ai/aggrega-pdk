[package]
name = "aggrega-pdk-rust"
version = "0.1.0-alpha.1"
edition = "2021"
description = "Plugin Development Kit for authoring Aggrega Wasm plugins in Rust."
license = "Apache-2.0"
repository = "https://github.com/aggrega-ai/aggrega-pdk-rust"

[lib]
path = "src/lib.rs"

[dependencies]
extism-pdk = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Envelope decoding for the external-input fetch binding. Same version
# line extism-pdk already pins transitively, so no new code enters the
# dependency tree.
base64 = "0.22"
# Portable ABI codec — sibling submodule in the umbrella. The crate name is its
# publication identity (crates.io: aggrega-abi); the local path serves the build.
aggrega-abi = { path = "../../aggrega-abi/rust" }

[dev-dependencies]
# JSON Schema 2020-12 validator. Selected over the `jsonschema` crate
# (whose 0.20+ line pulls in `icu_normalizer` >= 2.2 requiring Rust
# 1.86) to keep the Rust 1.85 floor.
#
# Note: `boon` transitively pulls in `idna` -> `idna_adapter`, which
# at >= 1.2 ALSO requires Rust 1.86. The `Cargo.lock` pins
# `idna_adapter` to the 1.1.x line via `cargo update --precise`;
# the PDK CI workflow at `.github/workflows/pdk.yml` runs a
# verification step that fails the build if a future `cargo update`
# bumps past that line before the Rust toolchain floor moves. See
# the README's "Toolchain pin requirements" section.
boon = "0.6"

[workspace]
members = [
    ".",
    "examples/cli",
    "examples/frp-step-patch",
    "examples/frp-step-host-patch",
    "examples/frp-step-host-patch-compose",
    "examples/frp-step-own-patch-compose",
    "examples/governance-adapter-skeleton",
    "examples/link-cross-boundary",
    "examples/mutator",
    "examples/parse",
    "examples/policy-settings",
    "examples/policy",
    "examples/render-node",
    "examples/render-node-nondeterministic",
    "examples/wasi-probe",
]

# These examples resolve dependency trees that would perturb this workspace's
# deliberate toolchain floor and shared lockfile — policy-regorus embeds a Rego
# evaluator that needs a newer Rust, policy-kubewarden-render pulls a YAML
# parser, policy-regorus-render pulls both, and policy-opa-wasm embeds a
# WebAssembly interpreter. All four are excluded here so this workspace never
# tries to build them under the floored toolchain; each is a self-contained
# workspace root with its own [workspace] table and its own Cargo.lock.
#
# Three of the four also pin their own toolchain. policy-kubewarden-render
# deliberately does not: its exclusion turns on that independent dependency
# resolution, not on a toolchain requirement, so it builds under the default
# toolchain and a pin would assert a requirement it does not have. Left unpinned
# on purpose — adding one is not a tidy-up.
exclude = [
    "examples/policy-regorus",
    "examples/policy-kubewarden-render",
    "examples/policy-regorus-render",
    "examples/policy-opa-wasm",
]
